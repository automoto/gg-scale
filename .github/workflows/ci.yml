name: CI

on:
  push:
    branches: [main]
    # Release tags run the full suite; publish-image then pushes to GHCR.
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Read-only token by default. Only publish-image raises this, to packages: write.
permissions:
  contents: read

env:
  GO_VERSION: "1.26.5"

jobs:

  lint:
    name: golangci-lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Verify go.mod
        run: go mod verify

      - name: Verify end-to-end buckets
        run: make check-e2e-buckets

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.11.4

  test:
    name: Unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Unit tests
        run: make test-ci

      - name: Upload unit test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unit-test-results-attempt-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 14

  integration:
    name: Integration tests
    needs: [lint, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Fast integration tests
        run: make test-integration-ci

      - name: Upload integration test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: integration-test-results-attempt-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 14

  end-to-end:
    name: End-to-end tests (${{ matrix.bucket }})
    needs: [lint, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        bucket: [a, b]
    env:
      # data/ is gitignored; avoid a root-created bind directory on a fresh runner.
      CONTROL_PANEL_BOOTSTRAP_TOKEN_FILE: /tmp/ggscale-bootstrap.token
      E2E_BUCKET: ${{ matrix.bucket }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Start end-to-end stack
        run: |
          mkdir -p test-results
          docker compose up -d --build --wait

      - name: End-to-end tests
        run: make "test-e2e-${E2E_BUCKET}"

      - name: Capture stack logs on failure
        if: failure()
        run: docker compose logs --no-color | tee test-results/docker-compose.log

      - name: Upload end-to-end test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: end-to-end-test-${{ matrix.bucket }}-results-attempt-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Stop end-to-end stack
        if: always()
        run: docker compose down -v --remove-orphans


  publish-image:
    name: Publish release image
    # Skipped automatically when any needed job fails or is skipped, so a red suite
    # or a non-release ref never reaches GHCR. workflow_dispatch on a tag ref does
    # not publish.
    needs: [lint, test, integration, end-to-end]
    if: >-
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v') &&
      github.repository == 'automoto/gg-scale'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/automoto/gg-scale
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Accept only stable vMAJOR.MINOR.PATCH tags
        run: |
          printf '%s\n' "$RELEASE_TAG" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' \
            || { echo "::error::$RELEASE_TAG is not a stable vMAJOR.MINOR.PATCH tag; nothing published"; exit 1; }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          # Exact release tag only. No latest, major, or minor aliases.
          tags: ${{ env.IMAGE }}:${{ env.RELEASE_TAG }}
          # The source label links the GHCR package to this repository.
          labels: |
            org.opencontainers.image.title=ggscale-server
            org.opencontainers.image.source=https://github.com/automoto/gg-scale
            org.opencontainers.image.version=${{ env.RELEASE_TAG }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: GIT_COMMIT=${{ github.sha }}
          provenance: mode=max
          sbom: true

      - name: Record published digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          ref="${IMAGE}@${DIGEST}"
          docker buildx imagetools inspect "$ref"
          {
            echo "## Published image"
            echo
            echo "- Tag: \`${IMAGE}:${RELEASE_TAG}\`"
            echo "- Digest pin for deployments: \`${ref}\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"

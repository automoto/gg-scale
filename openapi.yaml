      required:
        - player_id
        - verified
      type: object
  securitySchemes:
    ApiKeyAuth:
      description: Tenant API key (publishable or secret).
      scheme: bearer
      type: http
    PlayerSession:
      description: Player session JWT issued by the /v1/auth endpoints.
      in: header
      name: X-Session-Token
      type: apiKey
info:
  contact:
    name: ggscale
    url: https://github.com/automoto/gg-scale
  description: "Player-facing and game-server-facing HTTP API for ggscale. Authenticate with a tenant API key (Authorization: Bearer). Player endpoints additionally require a session token in X-Session-Token."
  title: ggscale API
  version: 1.0.0
openapi: 3.1.0
paths:
  /v1/account/remote-addrs:
    get:
      operationId: getAccountRemoteAddrs
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemoteAddrsPayload"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - ApiKeyAuth: []
          PlayerSession: []
      summary: Get the caller's remote addresses
      tags:
        - Remote Addresses
    put:
      operationId: putAccountRemoteAddrs
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RemoteAddrsPayload"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemoteAddrsPayload"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - ApiKeyAuth: []
          PlayerSession: []
      summary: Replace the caller's remote addresses
      tags:
        - Remote Addresses
  /v1/auth/anonymous:
    post:
      operationId: authAnonymous
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnonymousResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - ApiKeyAuth: []
      summary: Create an anonymous player session
      tags:
        - Authentication
  /v1/auth/custom-token:
    post:
      description: The developer's backend signs a short-lived JWT (EdDSA or RS256, aud "ggscale-custom-token", required exp, an external_id claim) with its private key; ggscale verifies it against the public key configured in the control panel and signs the player in, creating the player on first sign-in.
      operationId: authCustomToken
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomTokenRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - ApiKeyAuth: []
      summary: Exchange a tenant-signed token for a session
      tags:
        - Authentication
  /v1/auth/disable:
    post:
      description: "Self-service deactivation: revokes every session immediately and blocks sign-in. Players with credentials must re-authenticate with their password; anonymous players disable on the session alone. A project admin can re-enable the player with all data intact. Permanent deletion is requested through the account pages."
      operationId: disablePlayer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DisableInputBody"
        required: true
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - ApiKeyAuth: []
          PlayerSession: []
      summary: Disable the calling player
      tags:
        - Authentication
  /v1/auth/link:
    post:
      description: "The in-client upgrade path for anonymous players: the player id and every save, score, and friend stay untouched. A verification code is emailed; after POST /v1/auth/verify the credentials work on any device, and verification also links the global gg-scale account (unlocking display names and friends). An email another player in the project uses is a 409."
      operationId: linkEmail
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LinkEmailRequest"
        required: true
      responses:
        "202":
          description: Accepted
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - ApiKeyAuth: []
          PlayerSession: []
      summary: Attach email + password sign-in to the calling player
      tags:
        - Authentication
  /v1/auth/link/steam:
    post:
      description: Verifies a Steamworks session ticket (see POST /v1/auth/steam) and replaces the caller's generated identity with the Steam identity, so later native Steam sign-ins resolve to this player with all data intact. Only anonymous or email-signup identities can link; a Steam identity another player holds, or a developer-keyed custom-token identity, is a 409.
      operationId: linkSteam
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SteamAuthRequest"
        required: true
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - ApiKeyAuth: []
          PlayerSession: []
      summary: Attach a Steam identity to the calling player
      tags:
        - Authentication
  /v1/auth/login:
    post:
      operationId: authLogin
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - ApiKeyAuth: []
      summary: Log in with email and password
      tags:
        - Authentication
  /v1/auth/logout:
    post:
      operationId: authLogout
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogoutRequest"
        required: true
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - ApiKeyAuth: []
      summary: Revoke a refresh token
      tags:
        - Authentication
  /v1/auth/password:
    post:
      description: Requires the current password. Revokes every refresh token so other devices must sign in again; the caller's live access token keeps working until it expires.
      operationId: changePassword
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordInputBody"
        required: true
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - ApiKeyAuth: []
          PlayerSession: []
      summary: Change the calling player's password
      tags:
        - Authentication
  /v1/auth/password-reset:
    post:
      description: Emails a reset code when the address belongs to a player of the project. Always answers 202 — the response never reveals whether an account exists. Repeat requests inside a one-minute cooldown send nothing. Finish with POST /v1/auth/password-reset/confirm.
      operationId: requestPasswordReset
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetRequestInputBody"
        required: true
      responses:
        "202":
          description: Accepted
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - ApiKeyAuth: []
      summary: Request an in-client password reset code
      tags:
        - Authentication
  /v1/auth/password-reset/confirm:
    post:
      description: Sets the new password and revokes every existing session and refresh token for the player. Wrong codes are capped per code and per lifetime; a rejected new password does not consume the code.
      operationId: confirmPasswordReset
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetConfirmInputBody"
        required: true
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - ApiKeyAuth: []
      summary: Confirm a password reset with the emailed code
      tags:
        - Authentication
  /v1/auth/refresh:
    post:
      operationId: authRefresh
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - ApiKeyAuth: []
      summary: Rotate a refresh token
      tags:
        - Authentication
  /v1/auth/signup:
    post:
      operationId: authSignup
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupRequest"
        required: true
      responses:
        "202":
          description: Accepted
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - ApiKeyAuth: []
      summary: Sign up with email and password
      tags:
        - Authentication
  /v1/auth/steam:
    post:
      description: Verifies a Steamworks session ticket with Valve and signs the player in, creating the player on first sign-in. Obtain the ticket with ISteamUser::GetAuthTicketForWebApi("ggscale") and hex-encode it. Requires the project's Steam credentials to be configured in the control panel. 401 means Valve rejected the ticket (fetch a fresh one); 502 means Valve was unreachable (retry with backoff).
      operationId: authSteam
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SteamAuthRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - ApiKeyAuth: []
      summary: Exchange a Steam session ticket for a session
      tags:
        - Authentication
  /v1/auth/verify:
    post:
      operationId: authVerify
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerifyResult"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - ApiKeyAuth: []
      summary: Verify an email address with a code
      tags:
        - Authentication
  /v1/auth/verify/resend:
    post:
      description: Mints a fresh code (replacing the old one) when the address belongs to an unverified player, subject to a one-minute cooldown. Always answers 202. Signing up again with an existing email also answers 202 and sends a sign-in notice instead of a duplicate account.
      operationId: resendVerification
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResendVerifyInputBody"
        required: true
      responses:
        "202":
          description: Accepted
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - ApiKeyAuth: []
      summary: Resend the email verification code
      tags:
        - Authentication
  /v1/config:
    get:
      description: Returns the project-defined JSON object using only a project-pinned tenant API key. Send If-None-Match with a previous ETag to receive 304 when unchanged.
      operationId: getRemoteConfig
      parameters:
        - description: ETag from a previous config response.
          in: header
          name: If-None-Match
          schema:
            description: ETag from a previous config response.
            examples:
              - "\"remote-config-5f36b2ea290645ee34d943220a14b54ee5ea5be5b2ac97498f75ee173db9e9df\""
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties: true
                description: Arbitrary project-defined JSON key-value map.
                examples:
                  - daily_reward_multiplier: 1.5
                    maintenance_mode: false
                    minimum_client_version: 1.4.0
                type: object
          description: Current remote config
          headers:
            Cache-Control:
              schema:
                type: string
            ETag:
              schema:
                description: Validator for the current project config.
                type: string
        "304":
          description: Config has not changed; response has no body
      security:
        - ApiKeyAuth: []
      summary: Get the project's remote config
      tags:
        - Remote Config
  /v1/fleets/heartbeat:
    post:
      operationId: fleetHeartbeat
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HeartbeatRequest"
        required: true
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - ApiKeyAuth: []
      summary: Game-server liveness heartbeat
      tags:
        - Game Server Fleet
  /v1/fleets/{fleet}/servers:
    get:
      operationId: fleetServersList
      parameters:
        - in: path
          name: fleet
          required: true
          schema:
            examples:
              - default
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListServersResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - ApiKeyAuth: []
          PlayerSession: []
      summary: List live servers in a fleet
      tags:
        - Game Server Fleet
  /v1/friends:
    get:
      operationId: listFriends
      parameters:
        - explode: false
          in: query
          name: status
          schema:
            examples:
              - accepted
            type: string
        - explode: false
          in: query
          name: limit
          schema:
            examples:
              - "50"
            type: string
        - explode: false
          in: query
          name: cursor
          schema:
            examples:
              - "104"
            type: string
      responses:
        "200":
          content:

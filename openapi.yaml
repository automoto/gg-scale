servers:
  - description: Local development server (default HTTP_ADDR)
    url: http://localhost:8080
  - description: Self-hosted or managed deployment
    url: https://{host}
    variables:
      host:
        default: ggscale.example.com
tags:
  - description: "Player sign-in and session tokens: email/password, anonymous, and custom-token."
    name: Authentication
  - description: Project-defined live tuning values available before player login.
    name: Remote Config
  - description: "Per-project player identity: email and external console id."
    name: Player Profiles
  - description: Per-player JSON object storage with optimistic concurrency.
    name: Cloud Saves
  - description: Ranked scoreboards with server-authoritative score submission.
    name: Leaderboards
  - description: Friend requests, blocks, and online presence.
    name: Friends & Presence
  - description: Pre-game rooms with join codes, plus short-lived invites.
    name: Game Sessions & Invites
  - description: Tickets that return a roster, a game session, or a fleet allocation.
    name: Matchmaking
  - description: The WebSocket channel for presence, invites, and match events.
    name: Realtime
  - description: Short-lived TURN credentials for NAT traversal.
    name: P2P & TURN Relay
  - description: A player's opaque connect handles, such as a Steam id.
    name: Remote Addresses
  - description: Dedicated-server heartbeat and fleet listing. Beta.
    name: Game Server Fleet
  - description: Server-tier check of a player session token.
    name: Session Verification
  - description: Liveness probe.
    name: Health
